name: CI Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Линт — компиляция с failOnWarning
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('backend/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Компиляция с var inspection
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp compile \
            -Dmaven.compiler.showWarnings=true \
            -Dmaven.compiler.failOnWarning=true

  test:
    name: Unit-тесты
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('backend/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Unit-тесты (без интеграционных)
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp test -Dtest='!*IntegrationTest'

  integration-test:
    name: Интеграционные тесты (Docker)
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('backend/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Интеграционные тесты
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp test -Dtest='*IntegrationTest'

  quality:
    name: Verification and static analysis
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Tests, coverage report and dependency audit
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp verify
      - name: Checkstyle, SpotBugs, PMD and CPD
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp -DskipTests \
            checkstyle:check spotbugs:check pmd:check pmd:cpd-check
      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-quality-reports
          if-no-files-found: ignore
          path: |
            backend/target/site/jacoco/
            backend/target/dependency-check-report.*
