spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 10000
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    # КРИТИЧНО (аудит §23). Переопределяем locations из application.yml, где включён
    # ещё и classpath:db/seed. Демо-сид содержит ВЫДУМАННЫЕ линии, станции, выходы,
    # новости, расписания и праздники; на государственном портале они были бы
    # опубликованы как официальные данные. В production применяется только схема —
    # реальные данные вводятся через admin-консоль и конвейер импорта (ТЗ, раздел 13).
    #
    # Значение задано ЯВНО, а не удалением seed-каталога: сами файлы остаются в
    # репозитории с прежними версиями и контрольными суммами, поэтому уже
    # применённый seed на dev/демо-базах не ломает flyway validate.
    locations: classpath:db/migration

server:
  ssl:
    enabled: true
    key-store: ${SSL_KEY_STORE_PATH}
    key-store-password: ${SSL_KEY_STORE_PASSWORD}
    key-store-type: PKCS12
    key-alias: metro
  shutdown: graceful

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  security:
    issuer-uri: ${OIDC_ISSUER_URI}
    # Свойство должно совпадать с полем AdminAuthProperties (app.admin.dev-key);
    # иначе ADMIN_API_KEY молча игнорируется и ключ остаётся dev-дефолтным.
  admin:
    dev-key: ${ADMIN_API_KEY}
    # Никогда не наследуем известные dev bootstrap credentials в production.
    bootstrap:
      username: ${ADMIN_BOOTSTRAP_USER:}
      password: ${ADMIN_BOOTSTRAP_PASSWORD:}
      display-name: ${ADMIN_BOOTSTRAP_DISPLAY_NAME:}
    # Строгий режим актора (аудит-пункт 5): голый X-Admin-Actor больше не
    # принимается — только подписанный токен. Пустой секрет = fail-closed (401 на
    # все admin-write): без общего секрета консоль и backend не должны «доверять».
    actor-token:
      secret: ${ADMIN_ACTOR_TOKEN_SECRET}
      required: true

ai:
  llm:
    base-url: ${AI_LLM_BASE_URL:http://localhost:11434/v1}
    api-key: ${AI_LLM_API_KEY:}
    provider: ${AI_LLM_PROVIDER:disabled}
    model: ${AI_LLM_MODEL:llama3.2}
