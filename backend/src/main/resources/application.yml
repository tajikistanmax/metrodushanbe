# Конфигурация backend «Метро Душанбе» (dev).
# Порты/учётные данные — по docs/dev-conventions.md §2 (только dev!).

server:
  port: 8080
  servlet:
    context-path: /api   # контроллеры на /v1/... => итоговые пути /api/v1/...

spring:
  application:
    name: metro-backend

  datasource:
    url: jdbc:postgresql://localhost:5433/metro
    username: metro
    password: metro

  jpa:
    hibernate:
      # Схемой управляет ТОЛЬКО Flyway; Hibernate лишь проверяет соответствие маппинга
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    # Два каталога с РАЗНЫМ смыслом (аудит §23):
    #   db/migration — только схема; применяется во ВСЕХ средах, включая production;
    #   db/seed      — демонстрационные данные (выдуманные линии, станции, новости,
    #                  расписания, тарифы); применяется ТОЛЬКО вне production.
    # Flyway объединяет все locations и сортирует миграции по версии глобально,
    # поэтому сквозная нумерация V001…V027 сохраняется: dev получает V001,V002,V003…,
    # а prod — ту же последовательность без seed-версий. Дублирование одной версии в
    # двух каталогах запрещено (Flyway падает с «Found more than one migration»).
    #
    # Здесь (dev/test/демо-контур) seed ВКЛЮЧЁН намеренно: без него портал нечего показать.
    # В production он выключен в application-prod.yml, и DemoSeedGuard проверяет это
    # fail-closed на старте.
    locations: classpath:db/migration,classpath:db/seed

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    # с учётом context-path итоговый адрес: http://localhost:8080/api/swagger-ui.html
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:3001,http://localhost:3002
  admin:
    dev-key: ${ADMIN_DEV_KEY:dev-admin-key-change-me}
    # Первичный суперадмин создаётся на старте, только если активного ещё нет
    # (см. AdminUserBootstrap). Значения ниже — dev-defaults; в проде задаются
    # через env и пароль обязан быть заменён при первом входе.
    bootstrap:
      username: ${ADMIN_BOOTSTRAP_USER:admin}
      password: ${ADMIN_BOOTSTRAP_PASSWORD:metro2026-dev-only}
      display-name: ${ADMIN_BOOTSTRAP_DISPLAY_NAME:Суперадминистратор (dev)}
    # Подписанный токен актора аудита (аудит-пункт 5). В dev required=false:
    # интеграционные тесты и dev-контур ходят с голым X-Admin-Actor. Секрет —
    # общий с консолью (ADMIN_ACTOR_TOKEN_SECRET там же); в prod обязателен.
    actor-token:
      secret: ${ADMIN_ACTOR_TOKEN_SECRET:dev-actor-token-secret-change-me}
      required: false
      ttl: 2m
      clock-skew: 30s
    # Блокировка входа при подборе пароля (аудит-пункт 9).
    lockout:
      enabled: true
      account-max-failures: 5
      ip-user-max-failures: 10
      window: 15m
      lock-duration: 15m
  rate-limit:
    enabled: true
    capacity: 100
    refill-per-minute: 100

  security:
    issuer-uri: ""  # blank = dev mode (no JWT validation)
  feature-flags:
    cache-ttl-seconds: 60

  # Исходящие вебхуки (INT-02/03/05). Дефолты продублированы в
  # IntegrationProperties, поэтому приложение поднимется и без этого блока —
  # он здесь, чтобы значения были видны и правились без пересборки.
  # Сам обход очереди включается флагом integration.webhooks (по умолчанию выкл.).
  integration:
    poll-ms: 15000        # период тика диспетчера
    batch-size: 50        # доставок за тик
    max-attempts: 6       # исчерпание попыток → dead (DLQ)
    retry-base-delay: 30s # база экспоненты: base × 2^(attempts-1)
    retry-max-delay: 30m  # потолок задержки между попытками
    timeout: 10s          # HTTP-таймаут к подписчику
    claim-lease: 30s      # lease worker-а; после сбоя доставка вернётся в очередь

  # Отложенная публикация рассылок (NTF-05); включается флагом
  # notification.scheduler (по умолчанию выкл.).
  notifications:
    poll-ms: 30000
    batch-size: 50

ai:
  llm:
    provider: openai-compatible
    base-url: http://localhost:11434/v1
    api-key: ""
    model: llama3.2
    timeout: 30s
  agents:
    enabled: true
