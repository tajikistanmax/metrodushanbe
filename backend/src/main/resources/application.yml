# Конфигурация backend «Метро Душанбе» (dev).
# Порты/учётные данные — по docs/dev-conventions.md §2 (только dev!).

server:
  port: 8080
  servlet:
    context-path: /api   # контроллеры на /v1/... => итоговые пути /api/v1/...

spring:
  application:
    name: metro-backend

  datasource:
    url: jdbc:postgresql://localhost:5433/metro
    username: metro
    password: metro

  jpa:
    hibernate:
      # Схемой управляет ТОЛЬКО Flyway; Hibernate лишь проверяет соответствие маппинга
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    # с учётом context-path итоговый адрес: http://localhost:8080/api/swagger-ui.html
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
