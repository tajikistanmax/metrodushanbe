# Полный стек «Метро Душанбе» в контейнерах: postgres+redis+backend+web+admin.
#
# Это ОТДЕЛЬНЫЙ файл от infra/docker-compose.yml (тот — только dev-инфра: БД/Redis/
# Keycloak для локального запуска backend/web из исходников). Здесь всё собирается
# в образы и поднимается вместе — для демо/приёмки полного контура.
#
# Запуск (из корня репозитория):
#   docker compose -f infra/docker-compose.full.yml up -d --build
# Проверка конфигурации без запуска:
#   docker compose -f infra/docker-compose.full.yml config
# Остановка с удалением данных БД:
#   docker compose -f infra/docker-compose.full.yml down -v
#
# Порты на хосте согласованы с dev-конвенциями (docs/dev-conventions.md §2):
#   5433→postgres, 6379→redis, 8080→backend, 3000→web, 3001→admin.
# Отдельные имя проекта/контейнеров/тома (*-full) — чтобы стек НЕ конфликтовал с
# dev-инфрой по именам контейнеров и не смешивал данные (порты, впрочем, те же —
# одновременно поднимать dev-инфру и полный стек нельзя).
#
# Все секреты — dev-заглушки (см. application.yml, admin/src/lib/admin-actions.ts).

name: metrodushanbe-full

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: metro-postgres-full
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-metro}
      POSTGRES_USER: ${POSTGRES_USER:-metro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-metro}
    volumes:
      - pgdata-full:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-metro} -d ${POSTGRES_DB:-metro}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: metro-redis-full
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  tiles:
    image: ghcr.io/maplibre/martin:latest
    container_name: metro-tiles-full
    ports:
      - "3003:3000"
    environment:
      DATABASE_URL: postgres://metro:metro@postgres:5432/metro
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: metro-minio-full
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: metro
      MINIO_ROOT_PASSWORD: metro-dev-key-change
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: metro-backend:local
    container_name: metro-backend-full
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Relaxed binding Spring Boot: spring.datasource.* ← SPRING_DATASOURCE_*.
      # Внутри сети обращаемся к сервису postgres по ВНУТРЕННЕМУ порту 5432.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-metro}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-metro}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-metro}
      # Redis для кэша (@Cacheable во всех публичных read-сервисах). Без этого
      # backend идёт на localhost:6379 внутри своего контейнера, где Redis нет,
      # и кэшируемые эндпоинты падают с 500 (RedisConnectionFailureException).
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      # Секрет admin-контура (app.admin.dev-key) — через SPRING_APPLICATION_JSON,
      # чтобы обойти неоднозначность relaxed binding для ключа с дефисом (dev-key).
      # Значение согласовано с ADMIN_API_KEY у сервиса admin.
      SPRING_APPLICATION_JSON: '{"app":{"admin":{"dev-key":"${ADMIN_API_KEY:?ADMIN_API_KEY is required}"}}}'
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: metro
      MINIO_SECRET_KEY: metro-dev-key-change
      APP_TILES_BASE_URL: http://localhost:3003
    ports:
      - "8080:8080"
    healthcheck:
      # В образе нет curl/wget — используем TCP-проверку через /dev/tcp (bash есть).
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* инлайнится в бандл на этапе build. Публичный портал ходит
        # в API ИЗ БРАУЗЕРА, поэтому это host-адрес backend (не имя сервиса).
        NEXT_PUBLIC_API_BASE: ${WEB_API_BASE:-http://localhost:8080/api/v1}
        NEXT_PUBLIC_TILES_BASE_URL: http://localhost:3003
    image: metro-web:local
    container_name: metro-web-full
    depends_on:
      - backend
    ports:
      - "3000:3000"
    restart: unless-stopped

  admin:
    build:
      context: ../admin
      dockerfile: Dockerfile
    image: metro-admin:local
    container_name: metro-admin-full
    depends_on:
      - backend
    environment:
      ADMIN_API_BASE: http://backend:8080/api/v1
      # Fail-closed: эти значения обязательны даже для локального full-контура.
      ADMIN_API_KEY: ${ADMIN_API_KEY:?ADMIN_API_KEY is required}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?ADMIN_SESSION_SECRET is required}
    ports:
      - "3001:3001"
    restart: unless-stopped

volumes:
  pgdata-full:
  minio-data:
