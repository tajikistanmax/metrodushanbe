<svg width="1200" height="1200" viewBox="0 0 1200 1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .navy{fill:#082742}.red{fill:#E21B2D}.green{fill:#138A3D}.white{fill:#fff}.textNavy{fill:#082742;font-family:Montserrat,Arial,sans-serif;font-weight:700}.textRed{fill:#E21B2D;font-family:Montserrat,Arial,sans-serif;font-weight:800}.textGreen{fill:#138A3D;font-family:Montserrat,Arial,sans-serif;font-weight:700;letter-spacing:12px}
    </style>
  </defs>

  <rect width="1200" height="1200" fill="#ffffff"/>

  <!-- Icon group -->
  <g transform="translate(0,10)">
    <!-- tunnel arch -->
    <path class="navy" fill-rule="evenodd" d="M260 555 L260 345 C260 169 404 70 600 70 C796 70 940 169 940 345 L940 555 L875 555 L875 345 C875 210 766 135 600 135 C434 135 325 210 325 345 L325 555 Z"/>

    <!-- red M -->
    <path class="red" d="M418 505 L448 250 L600 405 L752 250 L782 505 L690 505 L675 355 L600 435 L525 355 L510 505 Z"/>

    <!-- rail perspective -->
    <path class="navy" d="M460 565 L560 565 L390 745 L230 745 Z"/>
    <path class="navy" d="M640 565 L740 565 L970 745 L810 745 Z"/>
    <path class="navy" d="M545 565 L655 565 L730 745 L470 745 Z" opacity="0.98"/>
    <path class="white" d="M570 565 L630 565 L675 745 L525 745 Z"/>

    <!-- sleepers -->
    <g class="navy">
      <rect x="550" y="590" width="100" height="10" rx="2"/>
      <rect x="535" y="620" width="130" height="12" rx="2"/>
      <rect x="515" y="655" width="170" height="14" rx="2"/>
      <rect x="490" y="700" width="220" height="17" rx="2"/>
    </g>
  </g>

  <!-- Text -->
  <text x="600" y="830" font-size="72" text-anchor="middle" class="textNavy" letter-spacing="20">DUSHANBE</text>
  <text x="600" y="930" font-size="105" text-anchor="middle" class="textRed" letter-spacing="22">METRO</text>

  <g transform="translate(0,990)">
    <rect x="250" y="-8" width="130" height="8" class="green"/>
    <text x="600" y="10" font-size="38" text-anchor="middle" class="textGreen">TAJIKISTAN</text>
    <rect x="820" y="-8" width="130" height="8" class="green"/>
  </g>
</svg>
